set-option -g default-shell /bin/zsh
set -g mouse on

# start numbering with 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Re number windows after closing one
set -g renumber-windows on

# Keymaps
# vim keys for split navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# shift N for previous window
bind N last-window


# List of plugins
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
# set -g @plugin 'hoshiya4522/tokyo-night-tmux'
set -g @plugin 'hoshiya4522/simple-vague-tmux'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'


# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
